name: CI — Terraform Guardrails & FinOps Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform-checks:
    name: Terraform Validate & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init & Validate (Module)
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform Init & Validate (Sandbox Example)
        working-directory: examples/sandbox-5-15-30
        run: |
          terraform init -backend=false
          terraform validate

      - name: Checkov IaC Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: false
          skip_check: CKV_AWS_272,CKV2_AWS_64

  python-scanner-tests:
    name: Python Scanner Unit Tests & Demo Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest suite
        run: pytest -v

      - name: Verify Demo Executive Report Generation
        run: |
          finops-scan --demo --output-dir /tmp/finops-demo
          test -s /tmp/finops-demo/executive-audit-report.md
          test -s /tmp/finops-demo/executive-audit-report.html
