[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-finops-guardrails"
version = "0.1.0"
description = "Read-only AWS cost waste scanner and executive report generator paired with Terraform budget guardrails."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Rahul Nadagoud", email = "aravnadagoud@gmail.com" }
]
dependencies = [
  "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
finops-scan = "finops_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
